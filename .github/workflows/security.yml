name: Seguranca

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Segunda, 09:00 BRT — dependencia vulneravel nao espera alguem abrir PR
    - cron: '0 12 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependencias:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades conhecidas
        # RNF-029: bloqueante em severidade alta.
        #
        # Via script, e nao `pnpm audit --audit-level high` direto, porque o
        # pnpm sai com codigo 1 tanto quando ACHA vulnerabilidade quanto quando
        # nao consegue falar com o registry. As duas terminam em vermelho — nao
        # verificar nao e verificar e estar limpo — mas o motivo precisa
        # aparecer na primeira linha do log. Ver scripts/audit.mjs.
        run: node scripts/audit.mjs

  revisao-de-dependencia:
    name: Revisao de dependencia
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # RNF-022: nenhum segredo em codigo, log ou variavel versionada
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
